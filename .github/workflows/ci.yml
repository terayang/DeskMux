name: CI

on:
  push:
    branches: [main]
  pull_request:

# The failure-comment step posts commit comments via the GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # The go embed directive (all:frontend/dist) requires dist to exist, so
      # the frontend must be built before go vet / go test can run.
      - name: Build frontend (required for go embed)
        run: npm --prefix frontend run build

      - run: npm run typecheck

      # Per-package steps bisect failures to the package level without needing
      # log access (step names show up in the runs API).
      - name: go test internal/scanner
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/scanner/... -count=1 -v 2>&1 | tee scanner-test.log
      - name: go test internal/sshx
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/sshx/... -count=1 -v 2>&1 | tee sshx-test.log
      - name: go test internal/rfb
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/rfb/... -count=1 -v 2>&1 | tee rfb-test.log
      - name: go test internal/vncbridge
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/vncbridge/... -count=1 -v 2>&1 | tee vncbridge-test.log
      - name: go test internal/store
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/store/... -count=1 -v 2>&1 | tee store-test.log

      # Log downloads require repo admin rights; post the failure excerpt as a
      # commit comment (publicly readable) so failures stay debuggable.
      - name: Post test log on failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## go test failure on ${{ matrix.os }}" > test-report.md
          for f in *-test.log; do echo "### $f" >> test-report.md; echo '```' >> test-report.md; tail -60 "$f" >> test-report.md; echo '```' >> test-report.md; done
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@test-report.md

      # Packaging: unsigned artifacts only (no signing certs / publish in CI).
      - name: Package macOS universal dmg
        if: matrix.os == 'macos-latest'
        run: npm run dist

      # NSIS cross-build works on macOS (wails + brew makensis), and is the
      # reliable path — makensis lookup on windows runners is flaky.
      - name: Install NSIS (macOS, for cross-build)
        if: matrix.os == 'macos-latest'
        run: brew install nsis

      - name: Package Windows installer + portable (cross-build)
        if: matrix.os == 'macos-latest'
        run: npm run dist:win

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: deskmux-wails-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: deskmux-wails-windows
          path: build/bin/*.exe
          if-no-files-found: error
