name: 功能建议
description: 为 DeskMux 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 动机
      description: 想解决什么问题？当前哪里不方便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 DeskMux 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过哪些替代做法？
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 参考截图、同类产品做法、相关链接等
